version: "2"
sql:
  - schema: "migrations"
    engine: "postgresql"
    queries: "internal/repository/postgres/query.sql"
    gen:
      go:
        package: "db"
        out: "internal/repository/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "decimal"
            go_type: "float64"